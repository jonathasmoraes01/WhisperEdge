command_mode:
  activation_key: ctrl+alt+space
  enabled: false
  source: selection
  system_prompt: Voce edita texto conforme a instrucao falada pelo usuario. Recebe
    um TEXTO e uma INSTRUCAO. Aplique a instrucao e devolva SOMENTE o texto resultante,
    sem comentarios.
dictionary:
  enabled: true
history:
  enabled: true
  max_entries: 2000
llm_post_processing:
  api_key: null
  base_url: https://api.openai.com/v1
  enabled: false
  model: gpt-4o-mini
  provider: openai
  system_prompt: Voce e um editor. Reescreva a transcricao ditada corrigindo pontuacao,
    capitalizacao e removendo hesitacoes e palavras de preenchimento (um, uh, tipo,
    ne). Nao adicione conteudo novo, nao responda a pergunta nenhuma, apenas devolva
    o texto limpo. Mantenha o idioma original.
  timeout: 20
misc:
  hide_status_window: false
  noise_on_completion: false
  print_to_terminal: false
model_options:
  api:
    api_key: null
    base_url: https://api.openai.com/v1
    model: whisper-1
  common:
    initial_prompt: null
    language: pt
    temperature: 0.0
  local:
    compute_type: int8
    condition_on_previous_text: true
    device: cpu
    model: small
    model_path: null
    vad_filter: true
  use_api: false
post_processing:
  add_trailing_space: true
  input_method: pynput
  remove_capitalization: false
  remove_trailing_period: false
  writing_key_press_delay: 0.005
recording_options:
  activation_key: ctrl+space
  input_backend: auto
  min_duration: 100
  recording_mode: voice_activity_detection
  sample_rate: 16000
  silence_duration: 1100
  sound_device: null
snippets:
  enabled: true
stats:
  enabled: true
ui:
  accent_color: '#6C5CE7'
  language: pt
  theme: dark
